version: '3.8'

services:
  # Ollama LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: opentale-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Flask Application
  web:
    build: .
    container_name: opentale-web
    ports:
      - "5000:5000"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./book_output:/app/book_output
    environment:
      - FLASK_ENV=production
      - LLM_URL=http://ollama:11434/v1
    command: sh -c "python web_app.py"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ollama_data:
    driver: local

networks:
  default:
    name: opentale-network
